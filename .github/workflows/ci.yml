name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # debug.keystore jest w .gitignore, a build.gradle.kts go wymaga – tworzymy go w CI.
      - name: Debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Testy jednostkowe i symulator balansu
        run: ./gradlew --no-daemon testDebugUnitTest
        env:
          DAOZ_SIM_HOURS: "48"

      - name: Nieudane testy jako adnotacje
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or bad.text or "")[:300].replace("\n", " ")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY
          grep -h "^e: " app/build/**/*.log 2>/dev/null | head -20 || true

      - name: Raport balansu w podsumowaniu
        if: always()
        run: cat app/build/sim/raport.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zgodność walki Sieci Dao (Kotlin ↔ Edge Function)
        run: node --experimental-strip-types --no-warnings supabase/functions/_shared/duel.parity.test.ts

      - name: Budowa APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/sim/
            app/build/golden/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: daozflame-debug-apk
          path: app/build/outputs/apk/debug/*.apk

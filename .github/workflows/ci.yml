name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # debug.keystore jest w .gitignore, a build.gradle.kts go wymaga – tworzymy go w CI.
      - name: Debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Testy jednostkowe i symulator balansu
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-test.log
        env:
          DAOZ_SIM_HOURS: "48"

      - name: Nieudane testy jako adnotacje
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or bad.text or "")[:300].replace("\n", " ")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY
          grep -E "^e: " gradle-test.log | head -20 | sed 's/^/::error::/' || true

      - name: Podgląd ekranów → gałąź previews
        if: success() && github.event_name == 'push'
        run: |
          test -d app/build/previews || exit 0
          cd app/build/previews
          git init -q && git checkout -q -b previews
          echo "Zrzuty z ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" > README.md
          git add . && git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Podgląd ekranów: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" previews

      - name: Raport balansu w podsumowaniu
        if: always()
        run: cat app/build/sim/raport.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zgodność walki Sieci Dao (Kotlin ↔ Edge Function)
        run: node --experimental-strip-types --no-warnings supabase/functions/_shared/duel.parity.test.ts

      - name: Budowa APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/sim/
            app/build/golden/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: daozflame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
